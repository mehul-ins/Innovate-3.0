<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Financing - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Section -->
    <div id="login-section">
        <div class="container">
            <h1>Supply Chain Financing Dashboard</h1>
            <form id="login-form">
                <h2>Login</h2>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Login</button>
                <div id="login-error" class="error"></div>
            </form>
            
            <div class="quick-login">
                <h3>Quick Login (Demo)</h3>
                <button onclick="quickLogin('admin@test.com', 'password123')">Login as ADMIN</button>
                <button onclick="quickLogin('supplier@test.com', 'password123')">Login as SUPPLIER</button>
                <button onclick="quickLogin('lender@test.com', 'password123')">Login as LENDER</button>
            </div>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" style="display: none;">
        <div class="header">
            <h1>Supply Chain Financing Dashboard</h1>
            <div class="user-info">
                <span id="user-role"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- Analytics Panel -->
            <div id="analytics-panel" class="panel" style="display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 32px;">
                <div class="dashboard-card" style="flex:1; min-width:220px;">
                    <h3>Total Orders</h3>
                    <div class="dashboard-value" id="analytics-total-orders">--</div>
                </div>
                <div class="dashboard-card" style="flex:1; min-width:220px;">
                    <h3>Active Milestones</h3>
                    <div class="dashboard-value" id="analytics-active-milestones">--</div>
                </div>
                <div class="dashboard-card" style="flex:1; min-width:220px;">
                    <h3>Loan Outstanding ($)</h3>
                    <div class="dashboard-value" id="analytics-loan-outstanding">--</div>
                </div>
                <div class="dashboard-card" style="flex:1; min-width:220px;">
                    <h3>Completed Milestones</h3>
                    <div class="dashboard-value" id="analytics-completed-milestones">--</div>
                </div>
            </div>

            <!-- Action Panel -->
            <div id="action-panel" class="panel">
                <h2>Actions</h2>
                <div id="action-buttons"></div>
            </div>

            <!-- Orders Panel -->
            <div class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0;">Orders</h2>
                    <div>
                        <button onclick="openNotificationsModal()" class="btn-secondary">View Notifications</button>
                        <button onclick="refreshOrders()" class="btn-secondary" style="margin-left: 8px;">Refresh</button>
                    </div>
                </div>
                <div id="orders-container"></div>
            </div>

            <!-- Create Order Modal (SUPPLIER only) -->
                <style>
                    .dashboard-card {
                        background: #20232E;
                        border-radius: 12px;
                        box-shadow: 0 2px 8px rgba(58,141,255,0.08);
                        padding: 24px 18px;
                        margin-bottom: 0;
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                    }
                    .dashboard-card h3 {
                        color: #8fa1c7;
                        font-size: 16px;
                        font-weight: 500;
                        margin-bottom: 10px;
                    }
                    .dashboard-value {
                        font-size: 32px;
                        font-weight: 700;
                        color: #3A8DFF;
                        margin-bottom: 4px;
                    }
                </style>
            <div id="create-order-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Create New Order</h2>
                    <form id="create-order-form">
                        <div class="form-group">
                            <label>Order ID:</label>
                            <input type="text" id="order-id" required>
                        </div>
                        <div class="form-group">
                            <label>Buyer Name:</label>
                            <input type="text" id="buyer-name" required>
                        </div>
                        <div class="form-group">
                            <label>Order Value ($):</label>
                            <input type="number" id="order-value" required>
                        </div>
                        <div class="form-group">
                            <label>Select Lender:</label>
                            <select id="modal-lender-id" required>
                                <option value="">Loading lenders...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Delivery Date:</label>
                            <input type="date" id="delivery-date" required>
                        </div>
                        <div class="form-group">
                            <label>Milestone Breakdown:</label>
                            <div id="milestone-list"></div>
                            <button type="button" id="add-milestone-btn">+ Add Milestone</button>
                        </div>
                        <button type="submit">Create Order</button>
                        <button type="button" onclick="closeModal('create-order-modal')">Cancel</button>
                    </form>
                    <div id="create-order-error" class="error"></div>
                </div>
            </div>

            <!-- Complete Milestone Modal -->
            <div id="complete-milestone-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Complete Milestone</h2>
                    <div id="milestone-info"></div>
                    <form id="complete-milestone-form">
                        <div class="form-group">
                            <label>Proof of Completion:</label>
                            <textarea id="milestone-proof" required rows="4"></textarea>
                        </div>
                        <button type="submit">Complete Milestone</button>
                        <button type="button" onclick="closeModal('complete-milestone-modal')">Cancel</button>
                    </form>
                    <div id="complete-milestone-error" class="error"></div>
                </div>
            </div>

            <!-- Order Details Modal -->
            <div id="order-details-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Order Details</h2>
                    <div id="order-details-content"></div>
                    <button onclick="closeModal('order-details-modal')">Close</button>
                </div>
            </div>

            <!-- Notifications Modal -->
            <div id="notifications-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Notifications</h2>
                    <div id="notifications-panel" style="max-height: 400px; overflow-y: auto;"></div>
                    <button onclick="closeModal('notifications-modal')" style="margin-top: 20px;">Close</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        .dashboard-card {
            background: #1a1a1a;
            border-radius: 14px;
            border: 1px solid rgba(255, 138, 51, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            padding: 26px 20px;
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: all 0.3s ease;
        }
        .dashboard-card:hover {
            border-color: rgba(255, 138, 51, 0.3);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(-3px);
        }
        .dashboard-card h3 {
            color: #b8b8b8;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .dashboard-value {
            font-size: 34px;
            font-weight: 700;
            color: #ff8a33;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
            text-shadow: 0 0 20px rgba(255, 138, 51, 0.15);
        }
    </style>

    <script src="app.js"></script>
</body>
</html>
